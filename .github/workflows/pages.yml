name: Deploy Pages

# GitHub Pages' "Deploy from a branch" source only supports / or /docs, not
# arbitrary folders like /site — so this publishes site/ via the Actions
# deployment method instead. Set Settings → Pages → Source to
# "GitHub Actions" (not "Deploy from a branch") for this to take effect.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "solver-ts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solver-ts
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm install

      - name: Type-check and run solver tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      # site/js/ is committed compiled output (Pages serves site/ with no
      # build step), so make sure it wasn't left stale after a .ts change.
      - name: Check compiled site/js is up to date
        run: |
          npm run build
          git diff --exit-code -- ../site/js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages looks the artifact up exactly once, and GitHub's artifact
      # API can lag a just-finished upload, failing with "No artifacts named
      # github-pages were found". Poll until it's visible before deploying.
      - name: Wait for Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              -q '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$n" -ge 1 ]; then echo "Artifact visible after $i check(s)"; exit 0; fi
            sleep 5
          done
          echo "::error::github-pages artifact never became visible to the API"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
