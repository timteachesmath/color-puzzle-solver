name: Daily Puzzle Solve

on:
  schedule:
    # Runs at 13:00 UTC daily — adjust to whenever the puzzle typically
    # drops. Cron is always UTC regardless of your local timezone.
    - cron: "0 13 * * *"
  workflow_dispatch: {} # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build TypeScript solver
        run: |
          cd solver-ts
          npm install
          npm run build

      - name: Restore Reddit session
        env:
          REDDIT_STATE_JSON: ${{ secrets.REDDIT_STATE_JSON }}
        run: echo "$REDDIT_STATE_JSON" > reddit_state.json

      - name: Run pipeline
        env:
          SUBREDDIT_NAME: ColorPuzzleGame
        run: python main.py

      - name: Commit and push new solution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/solutions/*.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Add solution for $(date -u +%Y-%m-%d)"
          git push
